<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keyword & Target Company Builder</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#192338;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:820px;margin:28px auto;padding:0 16px}.tag{color:#3157d5;font-size:11px;font-weight:800;letter-spacing:.12em}.card{background:white;border:1px solid #e1e6ef;border-radius:14px;padding:18px;margin:14px 0}h1{font-size:32px;margin:6px 0}h2{font-size:18px;margin:0 0 12px}.muted,small{color:#68748a}label{display:block;font-weight:650;font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d5dce8;border-radius:8px;font:inherit}textarea{min-height:75px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:8px;padding:10px 14px;background:#3157d5;color:white;font-weight:700;cursor:pointer;margin:8px 6px 0 0}.alt{background:#eaf0ff;color:#3157d5}.out{white-space:pre-wrap;background:#f7f8fc;border-radius:9px;padding:13px;min-height:60px}.item{border:1px solid #e1e6ef;border-radius:9px;padding:10px;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f6f7fb;border-radius:9px;padding:12px}.stat b{display:block;font-size:24px}@media(max-width:580px){.grid{grid-template-columns:1fr}.wrap{margin:18px auto}.stats{grid-template-columns:1fr 1fr}}footer{text-align:center;color:#68748a;font-size:12px;padding:20px}</style><main class="wrap"><div class="tag">COMPLETE JOB SEARCH EXECUTION SYSTEM · MODULE 01</div><h1>Keyword & Target Company Builder</h1><p class="muted">Generate job-search terms and organise target employers.</p><section class="card"><h2>Keyword bank</h2><div class="grid"><div><label>Target role *</label><input id="role" placeholder="Data Analyst"></div><div><label>Location</label><input id="loc" placeholder="Delhi / Remote"></div></div><label>Relevant skills (comma-separated)</label><input id="skills" placeholder="Excel, SQL, Python"><label>Related job titles</label><input id="titles" placeholder="Reporting Analyst, Junior Analyst"><label>Industry terms</label><input id="industry" placeholder="Fintech, retail, healthcare"><button onclick="keywords()">Generate search terms</button><div id="out" class="out" style="margin-top:12px">Your search terms appear here.</div><button class="alt" onclick="copyText()">Copy keywords</button></section><section class="card"><h2>Target company tracker</h2><div class="grid"><div><label>Company name *</label><input id="company"></div><div><label>Priority</label><select id="priority"><option>High</option><option>Medium</option><option>Low</option></select></div><div><label>Careers page / website</label><input id="url" placeholder="https://"></div><div><label>Status</label><select id="status"><option>To research</option><option>Researched</option><option>Role found</option><option>Applied</option><option>Not a fit</option></select></div></div><label>Research notes</label><textarea id="notes"></textarea><button onclick="add()">Add company</button><button class="alt" onclick="exportList()">Export list</button><div id="list"></div></section><footer>Module 01 · Job Search Strategy</footer></main><script>let key='',companies=[];const $=id=>document.getElementById(id);const split=s=>s.split(',').map(x=>x.trim()).filter(Boolean);function keywords(){let r=$('role').value.trim();if(!r){alert('Enter target role.');return}let t=[r,...split($('titles').value)],s=split($('skills').value),i=split($('industry').value),l=$('loc').value;key=`KEYWORD BANK\nTarget role: ${r}\nLocation: ${l||'Flexible'}\n\nROLE SEARCHES\n${t.map(x=>'"'+x+'" '+l).join('\n')}\n\nSKILL SEARCHES\n${s.map(x=>'"'+r+'" "'+x+'"').join('\n')||'Add relevant skills'}\n\nINDUSTRY SEARCHES\n${i.map(x=>'"'+r+'" "'+x+'"').join('\n')||'Add industry terms'}`;$('out').textContent=key}function copyText(){if(key)navigator.clipboard.writeText(key);else alert('Generate keywords first.')}function add(){let n=$('company').value.trim();if(!n){alert('Enter a company name.');return}companies.push({n,p:$('priority').value,u:$('url').value,s:$('status').value,note:$('notes').value});$('company').value=$('url').value=$('notes').value='';render()}function render(){$('list').innerHTML='';companies.forEach((c,i)=>{let d=document.createElement('div');d.className='item';let b=document.createElement('b');b.textContent=c.n+' · '+c.p;let p=document.createElement('p');p.textContent=c.s+' | '+c.u+' | '+c.note;let x=document.createElement('button');x.className='alt';x.textContent='Remove';x.onclick=()=>{companies.splice(i,1);render()};d.append(b,p,x);$('list').append(d)})}function exportList(){if(!companies.length){alert('Add companies first.');return}save('target-companies.txt',companies.map((c,i)=>`${i+1}. ${c.n}\nPriority: ${c.p}\nStatus: ${c.s}\nWebsite: ${c.u}\nNotes: ${c.note}`).join('\n\n'))}function save(n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;a.click();URL.revokeObjectURL(a.href)}</script></html>
